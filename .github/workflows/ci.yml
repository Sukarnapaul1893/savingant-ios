name: iOS CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build and run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project SavingAnt.xcodeproj \
            -scheme SavingAnt \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -only-testing:SavingAntTests \
            CODE_SIGNING_ALLOWED=NO
